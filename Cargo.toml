[package]
name = "repom"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust native desktop application to scan, monitor, and manage local Git repositories against GitHub."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MenukaDeshan/RepoM"
keywords = ["git", "github", "repository", "egui", "desktop"]
categories = ["development-tools", "gui"]

[[bin]]
name = "repom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = "0.29"
git2 = { version = "0.19", default-features = false }
rayon = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net"] }
toml = "0.8"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
wiremock = "0.6"
