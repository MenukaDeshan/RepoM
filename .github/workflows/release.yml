name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0; empty uses v<Cargo.toml version>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
            else
              CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
              TAG="v${CARGO_VER}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          PRERELEASE="false"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.asset_target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_target: windows-x86_64
            bin: repom.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_target: linux-x86_64
            bin: repom
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_target: macos-aarch64
            bin: repom
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_target: macos-x86_64
            bin: repom
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI and TLS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ensure Inno Setup is installed (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress --yes
          }

      - name: Build & package Windows setup installer and portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pwsh -File packaging/windows/package.ps1 `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Target "${{ matrix.target }}" `
            -OutDir "dist"

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          DIR="repom-${VER}-${{ matrix.asset_target }}"
          mkdir -p "${DIR}" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${DIR}/"
          cp README.md LICENSE repom.example.toml "${DIR}/"
          tar -czf "dist/${DIR}.tar.gz" "${DIR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_target }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          sha256sum repom-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release with auto-generated release notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: RepoM ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: release-assets/*
